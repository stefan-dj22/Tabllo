services:
  
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "secret"
      POSTGRES_DB: "tabllo-db"
    volumes:
      - ./db/data:/var/lib/postgresql/data    # Save db data
      - ./db/init-scripts:/docker-entrypoint-initdb.d # Init tables
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U user -d tabllo-db | grep "accepting connections"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  activemq:
    image: apache/activemq-classic:5.18.6
    environment:
      #ACTIVEMQ_CONF: "/opt/apache-activemq/conf"
      ACTIVEMQ_WRITE_LOGIN: "tabllo_user"
      ACTIVEMQ_WRITE_PASSWORD: "tabllo12345"
    #volumes:
      #- ./demo:/opt/apache-activemq/webapps-demo/demo    # demo web apps
      #- ./activeMQ/conf:/opt/apache-activemq/conf    # configuration
      #- ./activeMQ/data:/opt/apache-activemq/data    # data and logs
    ports:
      - "61613:61613" #stomp
      - "61614:61614" #ws
      - "61616:61616" #openwire
      - "8161:8161" #web admin GUI
    healthcheck:
      test: activemq status | grep running
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
  backend-app:
    build:
      context: ./backend-app/
    depends_on:
      db:
        condition: service_healthy
      activemq:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend-app/src
          action: sync
          target: usr/local/backend-app/src
        - path: ./backend-app/pom.xml
          action: rebuild
    ports: 
      - "8080:8080"
    healthcheck:
      test: curl -Is http://localhost:8080 | head -n 1 | grep "200"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    links:
      - db:database
      - activemq:activemq

  client:
    build:
      context: ./
      target: client-dev
    develop:
      watch:
        - path: ./frontend-app/src
          action: sync
          target: usr/local/app/src
        - path: ./frontend-app/package.json
          action: rebuild
    ports: 
      - "3000:3000"